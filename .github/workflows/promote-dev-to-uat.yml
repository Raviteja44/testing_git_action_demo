name: "2. Promote Dev to UAT"

on:
  workflow_dispatch:
    inputs:
      deployment_commit:
        description: 'Specific commit SHA from dev that was tested'
        required: true
        type: string
      deployment_reason:
        description: 'Reason for promotion'
        required: true
        type: string
        default: 'DEV testing successful'

permissions:
  contents: write
  pull-requests: write

jobs:
  promote-to-uat:
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate commit
        id: validate-commit
        run: |
          COMMIT_SHA="${{ github.event.inputs.deployment_commit }}"
          echo "Validating commit: $COMMIT_SHA"
          
          # Verify commit exists
          if ! git cat-file -e $COMMIT_SHA^{commit} 2>/dev/null; then
            echo "❌ Error: Commit $COMMIT_SHA does not exist"
            exit 1
          fi
          
          # Verify commit is in dev branch
          git fetch origin dev
          if ! git merge-base --is-ancestor $COMMIT_SHA origin/dev 2>/dev/null; then
            echo "❌ Error: Commit $COMMIT_SHA is not in dev branch"
            echo "💡 Make sure the commit has been merged to dev first"
            exit 1
          fi
          
          # Get commit details
          COMMIT_INFO=$(git log $COMMIT_SHA -1 --format="%h - %s - %an - %ad")
          COMMIT_AUTHOR=$(git log $COMMIT_SHA -1 --format="%an")
          COMMIT_MESSAGE=$(git log $COMMIT_SHA -1 --format="%s")
          
          echo "commit_info=$COMMIT_INFO" >> $GITHUB_OUTPUT
          echo "commit_author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          echo "commit_message=$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          
          echo "✅ Commit validated: $COMMIT_INFO"

      - name: Create UAT promotion PR
        uses: actions/github-script@v7
        env:
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
          DEPLOYMENT_REASON: ${{ github.event.inputs.deployment_reason }}
        with:
          script: |
            const commitSha = process.env.COMMIT_SHA;
            const deploymentReason = process.env.DEPLOYMENT_REASON;
            const commitInfo = '${{ steps.validate-commit.outputs.commit_info }}';
            const commitAuthor = '${{ steps.validate-commit.outputs.commit_author }}';
            const commitMessage = '${{ steps.validate-commit.outputs.commit_message }}';
            
            // Create unique promotion branch
            const timestamp = Date.now();
            const promoteBranch = `promote/uat-${commitSha.substring(0, 8)}-${timestamp}`;
            
            try {
              // Get current uat SHA
              const { data: uatRef } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'uat'
              });
              
              // Create promotion branch from uat
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${promoteBranch}`,
                sha: uatRef.commit.sha
              });
              
              // Merge the specific commit into promotion branch
              await github.rest.repos.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: promoteBranch,
                head: commitSha
              });
              
              const prBody = `
              ## 🟡 Promotion to UAT Environment
              **Commit:** ${commitInfo}
              **SHA:** ${commitSha}
              **Author:** ${commitAuthor}
              **Message:** ${commitMessage}
              **Promotion Reason:** ${deploymentReason}
              
              ### Verification Status:
              ✅ **Tested in DEV**: This specific change has been validated in development environment
              
              **Approval Required**: Team lead or manager approval needed for UAT promotion.
              
              *Auto-generated by GitHub Actions*
              `;
              
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🟡 UAT: Promote ${commitSha.substring(0, 8)} - ${commitMessage}`,
                body: prBody,
                head: promoteBranch,
                base: 'uat'
              });
              
              console.log(`✅ Created UAT promotion PR: ${pr.html_url}`);
              
              // Add labels
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['uat-promotion', 'specific-commit', 'environment-uat']
              });
              
            } catch (error) {
              console.error('❌ Failed to create UAT promotion PR:', error);
              throw error;
            }
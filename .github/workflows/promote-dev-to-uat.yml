name: "2. Promote to UAT"

on:
  workflow_dispatch:
    inputs:
      feature_branch:
        description: 'Your original feature branch name'
        required: true
        type: string
      dev_commit_sha:
        description: 'Commit SHA that was tested in DEV (from the DEV PR)'
        required: true
        type: string
      deployment_reason:
        description: 'Reason for UAT promotion'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-uat-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit belongs to feature branch
        id: validate
        run: |
          FEATURE_BRANCH="${{ github.event.inputs.feature_branch }}"
          COMMIT_SHA="${{ github.event.inputs.dev_commit_sha }}"
          
          echo "Validating commit $COMMIT_SHA belongs to $FEATURE_BRANCH"
          
          # Verify commit exists
          if ! git cat-file -e $COMMIT_SHA^{commit} 2>/dev/null; then
            echo "❌ Error: Commit $COMMIT_SHA does not exist"
            exit 1
          fi
          
          # Verify commit is in the feature branch
          git fetch origin $FEATURE_BRANCH
          if ! git merge-base --is-ancestor $COMMIT_SHA origin/$FEATURE_BRANCH 2>/dev/null; then
            echo "❌ Error: Commit $COMMIT_SHA is not in feature branch $FEATURE_BRANCH"
            exit 1
          fi
          
          # Verify commit is in dev branch (was deployed to dev)
          git fetch origin dev
          if ! git merge-base --is-ancestor $COMMIT_SHA origin/dev 2>/dev/null; then
            echo "❌ Error: Commit $COMMIT_SHA is not in dev branch"
            echo "💡 Make sure this commit was deployed to DEV first"
            exit 1
          fi
          
          # Get commit details
          COMMIT_INFO=$(git log $COMMIT_SHA -1 --format="%h - %s - %an - %ad")
          echo "commit_info=$COMMIT_INFO" >> $GITHUB_OUTPUT
          echo "✅ Commit validated: $COMMIT_INFO"

      - name: Create UAT PR with specific commit
        uses: actions/github-script@v7
        with:
          script: |
            const featureBranch = '${{ github.event.inputs.feature_branch }}';
            const commitSha = '${{ github.event.inputs.dev_commit_sha }}';
            const deploymentReason = '${{ github.event.inputs.deployment_reason }}';
            const commitInfo = '${{ steps.validate.outputs.commit_info }}';
            
            // Create promotion branch
            const promoteBranch = `promote/uat-${featureBranch.replace(/\//g, '-')}-${Date.now()}`;
            
            // Get current uat branch
            const { data: uatRef } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'uat'
            });
            
            // Create branch from uat
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${promoteBranch}`,
              sha: uatRef.commit.sha
            });
            
            // Merge the specific commit that was tested in DEV
            await github.rest.repos.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: promoteBranch,
              head: commitSha
            });
            
            const prBody = `
            ## 🟡 Promotion to UAT Environment
            **Feature Branch:** ${featureBranch}
            **Commit SHA:** ${commitSha}
            **Commit Details:** ${commitInfo}
            **Promotion Reason:** ${deploymentReason}
            
            **This contains ONLY your specific changes that were tested in DEV.**
            
            **Verification:**
            ✅ Deployed to DEV: ${commitSha.substring(0, 8)}
            ✅ Tested in DEV Environment
            
            **Approval Required:** Manager/Team Lead approval required.
            `;
            
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🟡 UAT: Promote ${featureBranch} (${commitSha.substring(0, 8)})`,
              body: prBody,
              head: promoteBranch,
              base: 'uat'
            });
            
            console.log(`✅ Created UAT promotion PR: ${pr.html_url}`);
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['uat-promotion', 'specific-commit']
            });
name: Promote UAT to Prod

on:
  workflow_dispatch:
    inputs:
      deployment_commit:
        description: 'Specific commit SHA from UAT that was tested'
        required: true
        type: string
      deployment_reason:
        description: 'Reason for production deployment'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote-to-prod:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate deployment commit
        run: |
          COMMIT_SHA="${{ github.event.inputs.deployment_commit }}"
          git fetch origin uat
          
          # Verify commit exists in uat branch
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/uat 2>/dev/null; then
            echo "❌ Commit $COMMIT_SHA is not in uat branch"
            exit 1
          fi
          
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV

      - name: Create Prod Promotion PR
        uses: actions/github-script@v7
        env:
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
        with:
          script: |
            const commitSha = process.env.COMMIT_SHA;
            const deploymentReason = '${{ github.event.inputs.deployment_reason }}';

            // Get commit details
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: commitSha
            });

            // Create promotion branch from current prod
            const promoteBranch = `promote/prod-${commitSha.substring(0, 8)}-${Date.now()}`;
            
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${promoteBranch}`,
              sha: context.sha
            });

            // Merge the specific commit
            await github.rest.repos.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: promoteBranch,
              head: commitSha
            });

            const prBody = `
            ## 🟢 Production Deployment
            **Source Commit:** ${commitSha}
            **Author:** ${commit.commit.author.name}
            **Message:** ${commit.commit.message}
            **Deployment Reason:** ${deploymentReason}
            
            **Verification Status:**
            ✅ Tested in DEV Environment
            ✅ Verified in UAT Environment  
            ✅ Ready for Production
            
            **Change Details:**
            \`\`\`
            ${commit.commit.message}
            \`\`\`
            `;

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🟢 PROD: Deploy ${commitSha.substring(0, 8)}`,
              body: prBody,
              head: promoteBranch,
              base: 'prod'
            });

            console.log(`✅ Created Production deployment PR: ${pr.html_url}`);
            
            // Add labels
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['production', 'specific-commit']
            });
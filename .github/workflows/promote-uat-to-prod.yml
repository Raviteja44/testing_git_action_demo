name: "3. Deploy to Production"

on:
  workflow_dispatch:
    inputs:
      feature_branch:
        description: 'Your original feature branch name'
        required: true
        type: string
      commit_sha:
        description: 'Same commit SHA that was tested in DEV and UAT'
        required: true
        type: string
      deployment_reason:
        description: 'Reason for production deployment'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-prod-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit
        id: validate
        run: |
          FEATURE_BRANCH="${{ github.event.inputs.feature_branch }}"
          COMMIT_SHA="${{ github.event.inputs.commit_sha }}"
          
          echo "Validating commit $COMMIT_SHA for production"
          
          # Verify commit exists
          if ! git cat-file -e $COMMIT_SHA^{commit} 2>/dev/null; then
            echo "❌ Error: Commit $COMMIT_SHA does not exist"
            exit 1
          fi
          
          # Verify commit is in uat branch (was promoted to UAT)
          git fetch origin uat
          if ! git merge-base --is-ancestor $COMMIT_SHA origin/uat 2>/dev/null; then
            echo "❌ Error: Commit $COMMIT_SHA is not in uat branch"
            echo "💡 Make sure this commit was promoted to UAT first"
            exit 1
          fi
          
          # Get commit details
          COMMIT_INFO=$(git log $COMMIT_SHA -1 --format="%h - %s - %an - %ad")
          echo "commit_info=$COMMIT_INFO" >> $GITHUB_OUTPUT
          echo "✅ Commit validated: $COMMIT_INFO"

      - name: Create Production PR
        uses: actions/github-script@v7
        with:
          script: |
            const featureBranch = '${{ github.event.inputs.feature_branch }}';
            const commitSha = '${{ github.event.inputs.commit_sha }}';
            const deploymentReason = '${{ github.event.inputs.deployment_reason }}';
            const commitInfo = '${{ steps.validate.outputs.commit_info }}';
            
            // Create promotion branch
            const promoteBranch = `promote/prod-${featureBranch.replace(/\//g, '-')}-${Date.now()}`;
            
            // Get current prod branch
            const { data: prodRef } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'prod'
            });
            
            // Create branch from prod
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${promoteBranch}`,
              sha: prodRef.commit.sha
            });
            
            // Merge the specific commit that was tested in UAT
            await github.rest.repos.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: promoteBranch,
              head: commitSha
            });
            
            const prBody = `
            ## 🟢 Production Deployment
            **Feature Branch:** ${featureBranch}
            **Commit SHA:** ${commitSha}
            **Commit Details:** ${commitInfo}
            **Deployment Reason:** ${deploymentReason}
            
            **This contains ONLY your specific changes that were tested in DEV & UAT.**
            
            **Verification Status:**
            ✅ Tested in DEV Environment
            ✅ Verified in UAT Environment  
            ✅ Ready for Production
            
            **Approval Required:** Manager/Director approval required.
            `;
            
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🟢 PROD: Deploy ${featureBranch} (${commitSha.substring(0, 8)})`,
              body: prBody,
              head: promoteBranch,
              base: 'prod'
            });
            
            console.log(`✅ Created Production deployment PR: ${pr.html_url}`);
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['production', 'specific-commit']
            });